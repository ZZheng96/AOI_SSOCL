# Demo5 M4 CPU 降配配置（§6.1 CPU <2s 挑战目标）
# 纯手工槽位（blob/trad/layout），无主干、无网络、无训练——CPU 原生快速。
# 预期精度低于 GPU 全量配置，如实报告（挑战目标以"可用"为标准，不降协议诚实性）。
# U9 实测（2026-08-15）：PDN 蒸馏学生特征质量不足（fused gap -0.14~-0.21），
# DINO 类槽位（sem/disc/inp）在 CPU 路径不启用。
seed: 42
device: cpu

protocol:
  n_init_normal: 100
  n_init_defect: 30
  forbid: [test_good, pairs, filename_metadata]

backbone:
  enabled: false            # 无主干：纯手工槽位（trad/blob/layout 不依赖特征提取）

tiling:
  mode: single              # CPU 快路径：整图单次处理
  tile_size: 512
  stride: 448
  multiscale_scales: [1, 2, 4]
  multiscale_weights: [0.6, 0.3, 0.1]

slots:
  sem:
    enabled: false          # 依赖主干特征，CPU 路径不启用
  disc:
    enabled: false
  blob:
    enabled: true           # LoG 斑点：纯传统视觉，CPU 快
  trad:
    enabled: true           # 200 维传统特征库：纯统计，CPU 快
  layout:
    enabled: true           # 统计布局模型：缺件/错位/顺序（§4.2），无网络
  inp:
    enabled: false          # 依赖主干特征
  tpl:
    enabled: false

fusion:
  mode: fixed_equal

router:
  enabled: false

consensus:
  enabled: false            # 阴性实测（2026-08-15）：CPU 3 槽位下共识反噬——
                            # gold_finger fused 0.5203(等权) → 0.3171(共识, -0.20)，
                            # solder_smt +0.058。U14 的"共识增益"不适用于 3 槽位 CPU 组合，
                            # 弱槽拖累的可靠杠杆是裁剪（exp_prune：drop_lt_0.6 保 blob 0.79）。
                            # CPU 路径保持等权，覆盖能力（blob/trad/layout）完整，
                            # 精度劣化如实报告（挑战目标以"可用"为准）

calibration:
  cdf_bins: 256

decision:
  tau_quantile: 0.99
  tau_gray: 0.95

hierarchical:
  mask_thresh: 0.5
  min_area: 16

datasets:
  gyu_det: E:\CPIPC\CGAIC\data_origin\GYU-DET
  data_local: E:\CPIPC\CGAIC\data_local

output_dir: E:\CPIPC\CGAIC\review\repro\research\outputs\m0
