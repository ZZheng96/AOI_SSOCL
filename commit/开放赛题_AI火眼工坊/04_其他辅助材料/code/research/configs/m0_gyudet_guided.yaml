seed: 42
device: cuda
protocol:
  n_init_normal: 100
  n_init_defect: 100
  forbid:
  - test_good
  - pairs
  - filename_metadata
fusion:
  # U76/U77：两级结构（guided）--shead 单槽自包含（粗筛库+判别头），
  # only_slots=[shead] + skip_zero_weight（U73 验证 fused=shead 单槽，
  # U75 验证 skip 不影响精度只提速）
  mode: fixed_equal
  weight_mode: sanity
  skip_zero_weight: true
  only_slots:
  - shead
backbone:
  name: dinov2_vits14
  output_layer: 9
  grid: 32
  extract_batch: 32  # 精查 8 crop 1 批前向
tiling:
  # U77 两级结构：整图 single 一次前向做粗筛 + 疑点 crop 精查
  # 速度预估：整图前向 ~250ms + 精查 8 crop ~250ms + 粗筛距离/候选 ~50ms
  # + 槽位开销 ~50ms ≈ 0.6s < 1s ✅
  mode: single
  tile_size: 512
  stride: 448
  multiscale_scales:
  - 1
  - 2
  - 4
  multiscale_weights:
  - 0.6
  - 0.3
  - 0.1
slots:
  sem:
    enabled: false  # guided 自包含粗筛库，不需 sem
  disc:
    enabled: false  # 不参与融合（skip_zero_weight 生效时本就不 fit）
  shead:
    enabled: true
    hidden: 256
    epochs: 100
    lr: 0.001
    batch: 32
    margin: 5.0
    pseudo_per_image: 0  # U74 教训：真实 crop 足量，伪异常拖低质量
    max_base_tiles: 96
    max_patches: 50000
    # U77 诚实冲 0.9 路径（v3 定稿，2026-08-19）：
    # v1 sem coreset 粗筛：缺陷 patch 稀疏（median=1），候选框 IoU 0.13，AUROC 0.5994 -- 弃用
    # v2 两级滑窗：AUROC 0.7484 但 46 窗前向 + 管线整图 = 1278ms 超红线 -- 弃用
    # v3 = ablB 验证配方（ctx crop 训练 + 滑窗打分 + topk3），减窗到速度达标：
    #   crop 699 stride 503（overlap 0.28）-> 3000x4000 -> 6x8=48 窗 -> ~350ms
    #   速度预估：管线整图 250ms + 48 窗 350ms + 槽位 100ms ≈ 700ms ✅
    score_mode: crop
    crop_size: 500  # fit 时自适应覆盖为中位缺陷框尺寸（训练用）
    crop_pad: 0.2
    n_fit_normal_crops: 10
    n_bg_per_defect: 3
    adaptive_crop_size: true
    use_context_crops: true  # ablB：上下文 crop 训练
    rand_sliding_train: false
    score_overlap: 0.28   # stride=699*0.72≈503 -> 48 窗（速度红线内）
    score_max_crops: 120
    score_topk: 3
    score_topk_ratio: 0.0
    use_adjacent_agg: false  # ablB：topk 聚合（3x3 平滑已在 ablB 验证为正贡献但此处简化）
  blob:
    enabled: false
  trad:
    enabled: false
  layout:
    enabled: false
  inp:
    enabled: false
  open:
    enabled: false
  tpl:
    enabled: false
    feat_weight: 0.7
    pix_weight: 0.3
    topk_ratio: 0.1
router:
  enabled: false
  epochs: 50
  lr: 0.001
  margin: 0.1
  lam_entropy: 0.1
  gate_margin: 0.005
consensus:
  enabled: false
  blend: 0.5
calibration:
  cdf_bins: 256
decision:
  tau_quantile: 0.99
  tau_gray: 0.95
hierarchical:
  mask_thresh: 0.5
  min_area: 16
  work_side: 512
datasets:
  gyu_det: D:\CGAIC\data_origin\GYU-DET
  data_local: D:\CGAIC\data_local
  mvtec: D:\CGAIC\data_origin\mvtec
  btad: D:\CGAIC\data_origin\BTAD\BTech_Dataset_transformed
  mpdd: D:\CGAIC\data_origin\MPDD
output_dir: d:\CGAIC\demo5\outputs\m0
